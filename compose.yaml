services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: venus
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: ${VENUS_POSTGRES_PASSWORD:?Set it in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - venus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus -d venus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  venus_postgres_data: