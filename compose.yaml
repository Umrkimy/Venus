# Postgres always runs here. Core and web join in server mode:
#   docker compose --profile server up -d --build
# Dev mode (start-venus.cmd) runs only Postgres and starts Core and web
# from the source with auto-reload. Both modes use ports 9000 and 3000,
# so stop one before starting the other.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: venus
      POSTGRES_USER: venus
      POSTGRES_PASSWORD: ${VENUS_POSTGRES_PASSWORD:?Set it in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - venus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venus -d venus"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Daily database backups (scripts/backup/backup.sh). Runs in both modes,
  # like Postgres. Files go to VENUS_BACKUP_DIR from .env (for example
  # E:/VenusBackups, another drive), or ./backups when it is not set.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["sh", "/scripts/backup.sh"]
    environment:
      PGPASSWORD: ${VENUS_POSTGRES_PASSWORD:?Set it in .env}
    volumes:
      - ./scripts/backup:/scripts:ro
      - ${VENUS_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Unhealthy when the newest daily backup is older than 26 hours.
      test: ["CMD-SHELL", "find /backups/daily -name '*.dump' -mmin -1560 | grep -q ."]
      interval: 10m
      timeout: 5s
      start_period: 1m
      start_interval: 2s
      retries: 1

  core:
    profiles: ["server"]
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    # Same secrets as dev mode; only the database address changes, because
    # inside Docker Postgres is reached by its service name.
    env_file: apps/core/.env
    environment:
      VENUS_CORE_DATABASE_URL: postgresql+psycopg://venus:${VENUS_POSTGRES_PASSWORD}@postgres:5432/venus
    ports:
      # The PC's Node connects to ws://localhost:9000.
      - "127.0.0.1:9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    profiles: ["server"]
    build:
      context: apps/web
      args:
        CORE_URL: http://core:9000
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  venus_postgres_data:
