name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        shell: pwsh
        working-directory: apps/core
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        shell: pwsh
        working-directory: apps/node
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Test Core
        shell: pwsh
        working-directory: apps/core
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Test Node
        shell: pwsh
        working-directory: apps/node
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Test shared protocol
        shell: pwsh
        run: .\apps\node\.venv\Scripts\python.exe -m pytest packages/venus-protocol/tests

  # Same Postgres as server mode. The Windows job above uses SQLite (fast);
  # this one catches what only real Postgres does (time zones, types,
  # migrations). Service containers need a Linux runner.
  core-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: venus
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: venus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venus -d venus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/core

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      # Fresh clone path: build every table from migrations, then make sure
      # the models need no new migration, and every downgrade works.
      - name: Migrations
        env:
          VENUS_CORE_DEV_NODE_TOKEN: ci-node-token
          VENUS_CORE_DATABASE_URL: postgresql+psycopg://venus:ci-only-password@127.0.0.1:5432/venus_test
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head

      # Only the test database address: config tests check that real
      # VENUS_CORE_* variables win over .env, so leave the others unset.
      - name: Test Core on Postgres
        env:
          VENUS_CORE_TEST_DATABASE_URL: postgresql+psycopg://venus:ci-only-password@127.0.0.1:5432/venus_test
        run: python -m pytest

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Server mode images build (no push, no secrets needed).
      - name: Build Core image
        run: docker build -f apps/core/Dockerfile -t venus-core .

      - name: Build web image
        run: docker build -t venus-web apps/web

      # Real backup service + restore script: seed a row, wait until the
      # backup healthcheck sees a dump, restore it into a test database.
      - name: Backup and restore
        env:
          VENUS_POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose up -d --wait postgres
          docker compose exec -T postgres psql -U venus -d venus -c "create table ci_check (x int); insert into ci_check values (1), (2);"
          docker compose up -d --wait backup
          docker compose logs backup
          ls -l backups/daily backups/weekly
          pwsh -File scripts/restore-db.ps1 -File "$(ls backups/daily/*.dump)" -Target venus_restore_test
          test "$(docker compose exec -T postgres psql -U venus -d venus_restore_test -tAc 'select count(*) from ci_check')" = "2"
