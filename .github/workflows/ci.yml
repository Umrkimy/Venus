name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Core dependencies
        shell: pwsh
        working-directory: apps/core
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Install Node dependencies
        shell: pwsh
        working-directory: apps/node
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Test Core
        shell: pwsh
        working-directory: apps/core
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Test Node
        shell: pwsh
        working-directory: apps/node
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Test shared protocol
        shell: pwsh
        run: .\apps\node\.venv\Scripts\python.exe -m pytest packages/venus-protocol/tests

  web:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Build web
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Server mode images build (no push, no secrets needed).
      - name: Build Core image
        run: docker build -f apps/core/Dockerfile -t venus-core .

      - name: Build web image
        run: docker build -t venus-web apps/web
